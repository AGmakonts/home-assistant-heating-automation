# Input Helpers Configuration for Heating System
# These helpers store state and runtime data for the heating automation

input_text:
  heating_runtime_data:
    name: "Heating Runtime Data"
    max: 2048
    initial: >
      {
        "system_start": null,
        "system_runtime": 0,
        "room_runtimes": {},
        "last_cycle_start": null,
        "current_floor": null,
        "cycle_count": 0
      }

input_boolean:
  heating_system_enabled:
    name: "Heating System Enabled"
    initial: true
    icon: mdi:radiator

input_number:
  heating_target_temperature:
    name: "Heating Target Temperature"
    initial: 19
    min: 15
    max: 25
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer
  
  heating_enable_threshold:
    name: "Heating Enable Threshold"
    initial: 17
    min: 10
    max: 20
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer-low
  
  heating_disable_threshold:
    name: "Heating Disable Threshold"
    initial: 19
    min: 15
    max: 25
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer-high

input_datetime:
  heating_last_enabled:
    name: "Heating Last Enabled"
    has_date: true
    has_time: true
  
  heating_last_disabled:
    name: "Heating Last Disabled"
    has_date: true
    has_time: true
